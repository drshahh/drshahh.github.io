    <script>
        /* --------------------------------
           Fullscreen
        -------------------------------- */

        const fsToggle = document.getElementById("fs-toggle");

        function updateFullscreenIcon() {
            const icon = fsToggle.querySelector("i");

            if (document.fullscreenElement) {
                icon.className = "bi bi-fullscreen-exit";
                fsToggle.setAttribute(
                    "aria-label",
                    "Exit fullscreen"
                );
            } else {
                icon.className = "bi bi-arrows-fullscreen";
                fsToggle.setAttribute(
                    "aria-label",
                    "Enter fullscreen"
                );
            }
        }

        fsToggle.addEventListener("click", async () => {
            try {
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                } else {
                    await document.exitFullscreen();
                }
            } catch (error) {
                /*
                 * Some mobile browsers restrict fullscreen.
                 * No intrusive alert is shown.
                 */
                console.log("Fullscreen unavailable:", error);
            }

            updateFullscreenIcon();
        });

        document.addEventListener(
            "fullscreenchange",
            updateFullscreenIcon
        );

        if (!document.fullscreenEnabled) {
            fsToggle.style.display = "none";
        }


        /* --------------------------------
           Button press + ripple effect
           Works with mouse, touch and pen.
        -------------------------------- */

        document.querySelectorAll(".btn").forEach(button => {

            button.addEventListener("pointerdown", event => {

                button.classList.add("is-pressed");

                const rect = button.getBoundingClientRect();

                const ripple = document.createElement("span");

                ripple.className = "ripple";

                ripple.style.left =
                    `${event.clientX - rect.left}px`;

                ripple.style.top =
                    `${event.clientY - rect.top}px`;

                button.appendChild(ripple);

                ripple.addEventListener(
                    "animationend",
                    () => ripple.remove()
                );
            });


            const removePressedState = () => {
                button.classList.remove("is-pressed");
            };

            button.addEventListener(
                "pointerup",
                removePressedState
            );

            button.addEventListener(
                "pointercancel",
                removePressedState
            );

            button.addEventListener(
                "pointerleave",
                removePressedState
            );
        });
    </script>
